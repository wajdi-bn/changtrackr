map $request_uri $chargetrackr_robots {
    default "noindex, nofollow, noarchive";
    ~^/(?:\?.*)?$ "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
    ~^/index\.html(?:\?.*)?$ "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
    ~^/(?:robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.png)(?:\?.*)?$ "";
    ~^/assets/ "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag $chargetrackr_robots always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
        expires 1h;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires 1d;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
