[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chargetrackr-ocpp-gateway"
version = "0.1.0"
description = "OCPP 1.6 JSON gateway for ChargeTrackr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "ocpp==2.1.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
]

[project.scripts]
chargetrackr-ocpp = "chargetrackr_ocpp.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
